en",color:"purple"}},ut=[{route:"campus",title:"\u56FE\u4E66\u9986\u7684\u7B2C\u4E00\u5929",tag:"Campus life",scene:"\u501F\u4E66\u4E0E\u95EE\u8DEF",script:"Welcome to the university library. You can borrow six books for thirty days. Please bring your student card. The quiet reading room is on the third floor. Group discussions are welcome on the first floor, but please book a room online before you arrive.",lq:[["How long can you keep the books?",["Seven days","Thirty days","Six days"],1,"\u5F55\u97F3\u8BF4 borrow six books for thirty days\uFF0Csix\u662F\u6570\u91CF\uFF0Cthirty\u662F\u5929\u6570\u3002"],["Where can students discuss a project?",["On the first floor","In the quiet reading room","On the third floor"],0,"Group discussions are welcome on the first floor\u3002"]],text:"A university library offers more than books. Students can use its databases to find reliable articles and reserve rooms for group work. Before starting a search, write down a clear question and a few keywords. If you cannot find a source, ask a librarian instead of giving up. A short conversation can save hours of searching. Remember to record where your information comes from so that you can refer to it later.",rq:[["What should you prepare before searching?",["A clear question and keywords","A printed essay","A room number"],0,"\u539F\u6587\u5EFA\u8BAE\u5148\u5199\u4E0B a clear question and a few keywords\u3002"],["Who can help you find a source?",["A librarian","A bus driver","A shop assistant"],0,"If you cannot find a source, ask a librarian\u3002"],["Why record your sources?",["To refer to them later","To borrow more books","To avoid all reading"],0,"\u672B\u53E5\u8BF4\u660E\u8BB0\u5F55\u51FA\u5904\u4FBF\u4E8E\u4EE5\u540E\u5F15\u7528\u548C\u67E5\u627E\u3002"]],speaking:["Could you tell me where the reading room is?","I would like to borrow this book for my project."],words:[["borrow","/\u02C8b\u0251\u02D0ro\u028A/","\u501F\u5165"],["library","/\u02C8la\u026Abreri/","\u56FE\u4E66\u9986"]],prompt:"\u7ED9\u540C\u5B66\u5199\u4E00\u6BB5\u82F1\u6587\uFF0C\u4ECB\u7ECD\u5982\u4F55\u5728\u56FE\u4E66\u9986\u627E\u5230\u5C0F\u7EC4\u8BA8\u8BBA\u5BA4\uFF0C\u5E76\u63D0\u9192\u63D0\u524D\u9884\u7EA6\u3002",requirements:["\u8BF4\u660E\u8BA8\u8BBA\u5BA4\u7528\u9014","\u5EFA\u8BAE\u63D0\u524D\u9884\u7EA6","\u8868\u8FBE\u6E05\u695A\u3001\u793C\u8C8C"]},{route:"campus",title:"\u627E\u5230\u4F60\u7684\u793E\u56E2\u642D\u5B50",tag:"Make connections",scene:"\u81EA\u6211\u4ECB\u7ECD\u4E0E\u793E\u56E2",script:"Hi, I am Amy from the English drama club. We meet every Wednesday at seven in the evening. You do not need acting experience to join. Our next meeting is about writing a short play. Bring a notebook and one interesting idea. New members are welcome to watch before taking part.",lq:[["When does the club meet?",["Monday morning","Wednesday evening","Friday afternoon"],1,"every Wednesday at seven in the evening\u3002"],["What should students bring?",["A costume","A notebook and an idea","A ticket"],1,"Bring a notebook and one interesting idea\u3002"]],text:"Joining a club can help you meet people outside your major. You do not have to choose the busiest or most popular one. Think about what you enjoy and how much time you can give. Visit a meeting, ask questions, and notice whether new members are included. A good club gives you space to learn and contribute. It should add something to university life rather than turn every evening into another deadline.",rq:[["What matters when choosing a club?",["Your interests and available time","Only its popularity","Only its membership fee"],0,"\u539F\u6587\u5EFA\u8BAE\u8003\u8651\u5174\u8DA3\u548C\u53EF\u6295\u5165\u65F6\u95F4\u3002"],["What can you do before joining?",["Visit a meeting","Skip all meetings","Promise to lead immediately"],0,"Visit a meeting, ask questions\u3002"],["What does a good club offer?",["Space to learn and contribute","A task every evening","A guaranteed job"],0,"A good club gives you space to learn and contribute\u3002"]],speaking:["I am interested in joining the English drama club.","Could I attend a meeting before I decide to join?"],words:[["attend","/\u0259\u02C8tend/","\u53C2\u52A0"],["contribute","/k\u0259n\u02C8tr\u026Abju\u02D0t/","\u8D21\u732E"]],prompt:"\u7528\u82F1\u6587\u4ECB\u7ECD\u4F60\u60F3\u53C2\u52A0\u7684\u793E\u56E2\u3001\u539F\u56E0\uFF0C\u4EE5\u53CA\u4F60\u80FD\u7ED9\u793E\u56E2\u5E26\u6765\u4EC0\u4E48\u3002",requirements:["\u4ECB\u7ECD\u793E\u56E2","\u8BF4\u660E\u5174\u8DA3\u6216\u539F\u56E0","\u63CF\u8FF0\u81EA\u5DF1\u7684\u8D21\u732E"]},{route:"campus",title:"\u5C0F\u7EC4\u4F5C\u4E1A\u4E0D\u6389\u7EBF",tag:"Work together",scene:"\u534F\u5546\u4E0E\u5206\u5DE5",script:"Our presentation is next Monday. Let us divide the work today. Jack will collect examples, and Lily will design the slides. I can prepare the introduction. Please send your part by Friday evening so that we have time to practise together on Sunday. Tell the group early if you need help.",lq:[["When should members send their work?",["Monday morning","Friday evening","Sunday night"],1,"Please send your part by Friday evening\u3002"],["Why finish before Sunday?",["To cancel the presentation","To practise together","To change the topic"],1,"so that we have time to practise together on Sunday\u3002"]],text:"Group work is easier when expectations are clear. At the first meeting, agree on the goal, divide the tasks, and choose a way to share progress. A deadline is useful only if everyone understands it. When a problem appears, describe the problem and suggest a next step. Blaming a quiet member rarely improves communication. Asking a specific question, such as whether they need an example, is more likely to help.",rq:[["What should a group do first?",["Agree on goals and tasks","Choose the quietest member","Write separate final reports"],0,"\u9996\u6BB5\u5F3A\u8C03\u76EE\u6807\u660E\u786E\u3001\u5206\u914D\u4EFB\u52A1\u548C\u6C9F\u901A\u8FDB\u5EA6\u3002"],["How should problems be handled?",["Describe them and suggest a next step","Blame one person","Ignore messages"],0,"\u539F\u6587\u660E\u786E\u5EFA\u8BAE describe the problem and suggest a next step\u3002"],["What is likely to improve communication?",["A specific helpful question","Public blame","An unclear deadline"],0,"\u672B\u53E5\u8BF4\u660E\u6709\u9488\u5BF9\u6027\u5730\u8BE2\u95EE\u662F\u5426\u9700\u8981\u793A\u4F8B\u66F4\u6709\u5E2E\u52A9\u3002"]],speaking:["Shall we divide the tasks before we start?","Please let us know if you need any help."],words:[["divide","/d\u026A\u02C8va\u026Ad/","\u5206\u914D\uFF1B\u5212\u5206"],["deadline","/\u02C8dedla\u026An/","\u622A\u6B62\u65F6\u95F4"]],prompt:"\u7ED9\u5C0F\u7EC4\u6210\u5458\u53D1\u4E00\u6BB5\u82F1\u6587\u6D88\u606F\uFF0C\u8BF4\u660E\u4EFB\u52A1\u5206\u5DE5\u3001\u63D0\u4EA4\u65F6\u95F4\uFF0C\u5E76\u9080\u8BF7\u6709\u56F0\u96BE\u7684\u4EBA\u53CA\u65F6\u6C9F\u901A\u3002",requirements:["\u660E\u786E\u4EFB\u52A1","\u8BF4\u660E\u63D0\u4EA4\u65F6\u95F4","\u9080\u8BF7\u6C9F\u901A"]},{route:"campus",title:"\u7ED9\u8001\u5E08\u5199\u5C01\u90AE\u4EF6",tag:"Say it clearly",scene:"\u793C\u8C8C\u63D0\u95EE\u4E0E\u90AE\u4EF6",script:"Professor Green has changed her office hours this week. Students can visit on Thursday between two and four in the afternoon. Her office is in Room 305. If that time does not work for you, send an email with your question and suggest another time. Please include your course name in the subject line.",lq:[["When are the office hours this week?",["Tuesday afternoon","Thursday afternoon","Thursday morning"],1,"Thursday between two and four in the afternoon\u3002"],["What belongs in the email subject?",["The course name","A phone password","The library number"],0,"include your course name in the subject line\u3002"]],text:"A helpful email makes its purpose easy to understand. Use a short subject line, introduce yourself if necessary, and explain your question with enough context. Instead of writing only that you are confused, mention the exercise or idea you are asking about. Keep the message polite and direct. Before sending it, check the attachment, the recipient, and your name. These small habits show respect for both your time and the reader's.",rq:[["What makes a question clearer?",["Specific context","More capital letters","No subject line"],0,"\u89E3\u91CA\u63D0\u95EE\u7684\u5177\u4F53\u7EC3\u4E60\u6216\u6982\u5FF5\u53EF\u63D0\u4F9B\u8DB3\u591F\u80CC\u666F\u3002"],["How should the message sound?",["Polite and direct","Angry and vague","Very long in every case"],0,"Keep the message polite and direct\u3002"],["What should you check before sending?",["Attachment, recipient and name","Only font color","Only the date"],0,"\u672B\u6BB5\u5217\u51FA attachment, recipient, and your name\u3002"]],speaking:["Could you explain the main idea of this exercise?","Thank you for taking the time to answer my question."],words:[["recipient","/r\u026A\u02C8s\u026Api\u0259nt/","\u6536\u4EF6\u4EBA"],["attachment","/\u0259\u02C8t\xE6t\u0283m\u0259nt/","\u9644\u4EF6"]],prompt:"\u7ED9\u8001\u5E08\u5199\u4E00\u5C01\u7B80\u77ED\u82F1\u6587\u90AE\u4EF6\uFF0C\u8BE2\u95EE\u4E00\u9053\u4F5C\u4E1A\u9898\uFF0C\u4EA4\u4EE3\u8BFE\u7A0B\u80CC\u666F\u5E76\u8868\u8FBE\u611F\u8C22\u3002",requirements:["\u90AE\u4EF6\u79F0\u547C\u4E0E\u7ED3\u5C3E","\u8BFE\u7A0B\u548C\u5177\u4F53\u95EE\u9898","\u793C\u8C8C\u8868\u8FBE\u611F\u8C22"]},{route:"cet4",title:"\u628A\u4F11\u606F\u5199\u8FDB\u8BA1\u5212",tag:"Build good habits",scene:"\u5065\u5EB7\u4E0E\u5B66\u4E60",script:"A student survey found that many learners study late but sleep poorly. The campus health centre suggests keeping a regular bedtime and taking short breaks during revision. Walking outdoors can help you return to a difficult task with a clearer mind. The advice is to build a routine you can maintain, rather than follow a perfect plan for only two days.",lq:[["What does the centre recommend?",["A regular bedtime","Studying all night","Skipping every break"],0,"\u5EFA\u8BAE keeping a regular bedtime\u3002"],["What kind of routine is preferred?",["The most difficult routine","One you can maintain","One lasting only two days"],1,"build a routine you can maintain\u3002"]],text:"Students often treat rest as a reward that comes after all the work is done. Yet university work rarely has a natural stopping point. There is always another article, another exercise, or another message. Planning a break is therefore a practical decision, not a sign of laziness. A sustainable timetable leaves room for sleep and movement. It also helps students notice which tasks really matter instead of measuring success only by hours spent at a desk.",rq:[["Why is waiting until all work is done a problem?",["There is usually more work","Rest is unnecessary","Every task has a fixed end"],0,"university work rarely has a natural stopping point\u3002"],["What is the main argument?",["Rest belongs in a sustainable routine","Success depends only on hours","Students should avoid exercise"],0,"\u5168\u6587\u5F3A\u8C03\u4F11\u606F\u662F\u53EF\u6301\u7EED\u8BA1\u5212\u7684\u4E00\u90E8\u5206\u3002"],["What should students focus on?",["Important tasks","Desk time alone","Every notification"],0,"\u672B\u53E5\u53CD\u5BF9\u53EA\u7528\u5750\u5728\u684C\u524D\u7684\u65F6\u95F4\u8861\u91CF\u6210\u529F\u3002"]],speaking:["Taking a short break helps me concentrate on my work.","A realistic plan should leave enough time for sleep."],words:[["concentrate","/\u02C8k\u0251\u02D0ns\u0259ntre\u026At/","\u96C6\u4E2D\u6CE8\u610F\u529B"],["sustainable","/s\u0259\u02C8ste\u026An\u0259bl/","\u53EF\u6301\u7EED\u7684"]],prompt:"\u5199\u4E00\u6BB5\u82F1\u6587\uFF0C\u89E3\u91CA\u4E3A\u4EC0\u4E48\u5B66\u4E60\u8BA1\u5212\u4E2D\u4E5F\u9700\u8981\u4F11\u606F\uFF0C\u5E76\u63D0\u51FA\u4E24\u6761\u5EFA\u8BAE\u3002",requirements:["\u660E\u786E\u89C2\u70B9","\u89E3\u91CA\u4F11\u606F\u7684\u4F5C\u7528","\u4E24\u6761\u53EF\u6267\u884C\u5EFA\u8BAE"]},{route:"cet4",title:"\u4F4E\u78B3\u51FA\u884C\u8FD9\u4E00\u7AD9",tag:"A greener choice",scene:"\u4EA4\u901A\u4E0E\u73AF\u5883",script:"The city is encouraging students to combine walking, cycling and public transport. A new bus route will connect the university area with the train station. Buses are expected every fifteen minutes during the day. Students should check the route map before travelling because the last bus leaves earlier on weekends.",lq:[["How often are buses expected in daytime?",["Every five minutes","Every fifteen minutes","Once an hour"],1,"every fifteen minutes during the day\u3002"],["Why check the weekend timetable?",["The last bus is earlier","All routes are closed","Tickets are free"],0,"the last bus leaves earlier on weekends\u3002"]],text:"Transport choices depend on more than personal preference. A student may want to cycle but avoid a road without safe crossings. Another may choose a bus if the timetable is reliable. To encourage greener journeys, cities need to make these options convenient and safe. Campaigns can raise awareness, but useful infrastructure changes everyday decisions. Better lighting, connected cycle lanes and clear route information can make a small journey easier for many people.",rq:[["What can discourage cycling?",["Unsafe crossings","Clear route information","Connected lanes"],0,"\u9996\u6BB5\u4EE5\u7F3A\u5C11\u5B89\u5168\u8FC7\u8857\u70B9\u4E3A\u4F8B\u3002"],["What does the writer emphasize?",["Convenience and safety","Awareness alone","Personal preference alone"],0,"cities need to make these options convenient and safe\u3002"],["Which is an infrastructure improvement?",["Better lighting","A slogan only","A personal promise"],0,"\u672B\u53E5\u5C06\u7167\u660E\u5217\u4E3A\u57FA\u7840\u8BBE\u65BD\u6539\u8FDB\u3002"]],speaking:["Public transport should be reliable and easy to use.","Safe cycle lanes can encourage more students to ride."],words:[["reliable","/r\u026A\u02C8la\u026A\u0259bl/","\u53EF\u9760\u7684"],["convenient","/k\u0259n\u02C8vi\u02D0ni\u0259nt/","\u65B9\u4FBF\u7684"]],prompt:"\u7528\u82F1\u6587\u8BA8\u8BBA\u5982\u4F55\u9F13\u52B1\u5B66\u751F\u9009\u62E9\u7EFF\u8272\u51FA\u884C\uFF0C\u63D0\u51FA\u63AA\u65BD\u5E76\u89E3\u91CA\u539F\u56E0\u3002",requirements:["\u7ED9\u51FA\u5177\u4F53\u63AA\u65BD","\u8BF4\u660E\u63AA\u65BD\u5982\u4F55\u8D77\u4F5C\u7528","\u4F7F\u7528\u6070\u5F53\u8854\u63A5"]},{route:"cet4",title:"\u5FD7\u613F\u6D3B\u52A8\u6709\u56DE\u58F0",tag:"Make a difference",scene:"\u5FD7\u613F\u670D\u52A1",script:"The community reading programme needs volunteers on Saturday mornings. Volunteers will read stories with children and help them choose books. Training will be provided on Friday afternoon. You do not need teaching experience, but you should be patient and willing to listen. Please register before Wednesday if you can attend regularly.",lq:[["When is the activity?",["Saturday morning","Friday morning","Wednesday evening"],0,"on Saturday mornings\u3002"],["Which quality is requested?",["Patience","A teaching certificate","Professional acting"],0,"should be patient and willing to listen\u3002"]],text:"Volunteering is sometimes described only in terms of what a volunteer gains. Experience and confidence are valuable, but the needs of the community should come first. A reading programme, for example, benefits from volunteers who turn up regularly and learn what each child enjoys. Listening matters as much as leading. Meaningful service is built through small, reliable actions rather than a single impressive photograph. Reflection can help volunteers understand both their contribution and their limits.",rq:[["What should come first?",["Community needs","A volunteer's photographs","An impressive title"],0,"the needs of the community should come first\u3002"],["What helps a reading programme?",["Regular attendance and listening","Frequent replacement","Only leading"],0,"\u5FD7\u613F\u8005\u5E94\u7A33\u5B9A\u5230\u573A\u5E76\u4E86\u89E3\u5B69\u5B50\u5174\u8DA3\u3002"],["What does reflection help volunteers understand?",["Contribution and limits","Only publicity","Only travel time"],0,"\u672B\u53E5\u660E\u786E\u8BF4\u660E reflection \u7684\u4F5C\u7528\u3002"]],speaking:["I would like to take part in the reading programme.","Listening carefully is just as important as giving advice."],words:[["volunteer","/\u02CCv\u0251\u02D0l\u0259n\u02C8t\u026Ar/","\u5FD7\u613F\u8005"],["patient","/\u02C8pe\u026A\u0283nt/","\u6709\u8010\u5FC3\u7684"]],prompt:"\u5199\u4E00\u6BB5\u7533\u8BF7\u5FD7\u613F\u6D3B\u52A8\u7684\u82F1\u6587\uFF0C\u8BF4\u660E\u5174\u8DA3\u3001\u80FD\u63D0\u4F9B\u7684\u5E2E\u52A9\u53CA\u80FD\u5426\u6301\u7EED\u53C2\u52A0\u3002",requirements:["\u6D3B\u52A8\u610F\u613F","\u76F8\u5173\u80FD\u529B\u6216\u54C1\u8D28","\u53EF\u53C2\u52A0\u7684\u65F6\u95F4"]},{route:"cet4",title:"\u5C4F\u5E55\u4E4B\u5916\u7684\u4E13\u6CE8",tag:"Stay focused",scene:"\u79D1\u6280\u4E0E\u4E60\u60EF",script:"During revision week, the student learning centre will offer a quiet study session every afternoon. Phones may be kept in a box near the entrance, but this is optional. Participants can set a goal before each session and review it afterwards. The aim is to reduce unnecessary interruptions, not to ban useful technology.",lq:[["Is leaving a phone in the box required?",["Yes, for everyone","No, it is optional","Only for teachers"],1,"but this is optional\u3002"],["What is the aim?",["Reduce unnecessary interruptions","Ban all technology","Replace every class"],0,"reduce unnecessary interruptions\u3002"]],text:"A notification does not need to last long to interrupt concentration. After checking it, a learner may need time to remember where they stopped. Turning off unnecessary alerts can therefore be more useful than simply promising to work harder. Technology itself is not the enemy: a dictionary or a calendar can support learning. The challenge is to decide what deserves attention now. Clear intentions help students use devices as tools rather than follow every invitation on the screen.",rq:[["What is a cost of checking a notification?",["Time to return to the task","Better memory in every case","No interruption"],0,"\u9700\u8981\u65F6\u95F4\u56DE\u60F3\u4E4B\u524D\u505C\u5728\u54EA\u91CC\u3002"],["How does the writer view technology?",["It can support learning","It is always harmful","It should never be used"],0,"dictionary or calendar can support learning\u3002"],["What is the central challenge?",["Choosing what needs attention","Buying more devices","Avoiding all calendars"],0,"decide what deserves attention now\u3002"]],speaking:["I turn off unnecessary notifications when I am studying.","Technology is useful when we use it with a clear purpose."],words:[["notification","/\u02CCno\u028At\u026Af\u026A\u02C8ke\u026A\u0283n/","\u901A\u77E5"],["intention","/\u026An\u02C8ten\u0283n/","\u610F\u56FE\uFF1B\u6253\u7B97"]],prompt:"\u7528\u82F1\u6587\u8BBA\u8FF0\u624B\u673A\u5982\u4F55\u5F71\u54CD\u5B66\u4E60\u4E13\u6CE8\uFF0C\u5E76\u63D0\u51FA\u5E73\u8861\u4F7F\u7528\u7684\u5EFA\u8BAE\u3002",requirements:["\u8BA8\u8BBA\u5F71\u54CD","\u627F\u8BA4\u6709\u76CA\u7528\u9014","\u63D0\u51FA\u5177\u4F53\u5EFA\u8BAE"]},{route:"cet6",title:"\u548C AI \u4E00\u8D77\u4FDD\u6301\u601D\u8003",tag:"Think critically",scene:"\u4EBA\u5DE5\u667A\u80FD\u4E0E\u5B66\u4E60",script:"At a seminar on artificial intelligence, the speaker distinguished assistance from substitution. A tool may help students compare explanations, but it should not replace their responsibility to check evidence. Participants were asked to identify one claim they would verify independently. The discussion focused on making the learning process visible rather than judging only the final answer.",lq:[["What distinction did the speaker make?",["Assistance and substitution","Reading and listening","Speed and distance"],0,"distinguished assistance from substitution\u3002"],["What were participants asked to do?",["Verify a claim independently","Accept every answer","Avoid using evidence"],0,"identify one claim they would verify independently\u3002"]],text:"The educational value of an intelligent tool depends partly on the questions a learner brings to it. If the aim is merely to finish an assignment, an instant answer can conceal gaps in understanding. If the aim is to compare explanations, the same tool may reveal those gaps. Assessment should therefore consider the process: which assumptions were questioned, which sources were checked, and why a conclusion was accepted. This does not require rejecting technology. It requires designing tasks in which judgment remains visible and responsibility cannot be outsourced to a fluent response.",rq:[["When may an instant answer hide gaps?",["When completion is the only aim","When sources are checked","When explanations are compared"],0,"\u7B2C\u4E8C\u53E5\u6307\u51FA\u4EC5\u4E3A\u5B8C\u6210\u4F5C\u4E1A\u53EF\u80FD\u63A9\u76D6\u7406\u89E3\u7F3A\u53E3\u3002"],["What should assessment consider?",["The reasoning process","Only response length","Only fluent wording"],0,"Assessment should therefore consider the process\u3002"],["What does 'outsourced' suggest here?",["Handing responsibility to a tool","Consulting a library","Working with classmates"],0,"\u6587\u4E2D\u6307\u4E0D\u80FD\u628A\u5224\u65AD\u8D23\u4EFB\u4EA4\u7ED9\u6D41\u7545\u7684\u673A\u5668\u56DE\u7B54\u3002"]],speaking:["A convincing answer still needs to be supported by evidence.","We should use intelligent tools to develop judgment rather than replace it."],words:[["assumption","/\u0259\u02C8s\u028Cmp\u0283n/","\u5047\u8BBE"],["evidence","/\u02C8ev\u026Ad\u0259ns/","\u8BC1\u636E"]],prompt:"\u7528\u82F1\u6587\u8BA8\u8BBA\u5927\u5B66\u751F\u5982\u4F55\u8D1F\u8D23\u4EFB\u5730\u4F7F\u7528AI\u8F85\u52A9\u5B66\u4E60\uFF0C\u7ED9\u51FA\u89C2\u70B9\u3001\u7406\u7531\u4E0E\u5177\u4F53\u505A\u6CD5\u3002",requirements:["\u660E\u786E\u7ACB\u573A","\u89E3\u91CA\u8F85\u52A9\u4E0E\u66FF\u4EE3\u7684\u533A\u522B","\u63D0\u51FA\u6838\u67E5\u8BC1\u636E\u7684\u65B9\u6CD5"]},{route:"cet6",title:"\u8BFB\u61C2\u7814\u7A76\u7684\u8FB9\u754C",tag:"Read the evidence",scene:"\u5B66\u672F\u9605\u8BFB",script:"A research workshop reminded students that correlation does not establish causation. The tutor used a survey of study habits to show how an unmeasured factor might influence results. Students were encouraged to examine the sample and the method before repeating a headline. A limitation, the tutor argued, is information about how far a conclusion can travel.",lq:[["What does correlation fail to establish by itself?",["Causation","An observed association","A survey topic"],0,"correlation does not establish causation\u3002"],["What should students examine?",["The sample and method","Only the headline","Only the author's photo"],0,"examine the sample and the method\u3002"]],text:"Research reports often reach the public through simplified headlines. Simplification is not necessarily misleading, but it can remove conditions that matter. A result from a narrow sample may not describe all students, and an association may have more than one explanation. Reading critically means asking what the study actually measured and what remains uncertain. Limitations should not automatically discredit a study; they help define its contribution. A careful reader neither accepts a claim because it sounds scientific nor dismisses it because it is incomplete. Instead, confidence should reflect the quality and scope of the evidence.",rq:[["What can simplification remove?",["Important conditions","All possible meanings","Only spelling errors"],0,"it can remove conditions that matter\u3002"],["How should limitations be viewed?",["As boundaries of a contribution","As automatic proof of failure","As irrelevant details"],0,"they help define its contribution\u3002"],["What should confidence reflect?",["Evidence quality and scope","Headline popularity","Author confidence alone"],0,"\u6700\u540E\u4E00\u53E5\u7ED9\u51FA\u5224\u65AD\u539F\u5219\u3002"]],speaking:["The findings should be interpreted in the context of the sample.","A limitation helps us understand the scope of a conclusion."],words:[["causation","/k\u0254\u02D0\u02C8ze\u026A\u0283n/","\u56E0\u679C\u5173\u7CFB"],["scope","/sko\u028Ap/","\u8303\u56F4"]],prompt:"\u5199\u4E00\u6BB5\u82F1\u6587\u8BF4\u660E\u9605\u8BFB\u7814\u7A76\u62A5\u544A\u65F6\u4E3A\u4EC0\u4E48\u8981\u5173\u6CE8\u6837\u672C\u3001\u65B9\u6CD5\u4E0E\u5C40\u9650\uFF0C\u907F\u514D\u628A\u76F8\u5173\u5F53\u56E0\u679C\u3002",requirements:["\u6D89\u53CA\u6837\u672C\u548C\u65B9\u6CD5","\u89E3\u91CA\u7814\u7A76\u5C40\u9650","\u533A\u5206\u76F8\u5173\u4E0E\u56E0\u679C"]},{route:"cet6",title:"\u53EF\u6301\u7EED\uFF0C\u4E0D\u6B62\u4E00\u53E5\u53E3\u53F7",tag:"From ideas to action",scene:"\u53EF\u6301\u7EED\u53D1\u5C55",script:"The university sustainability forum will compare two approaches to reducing waste. One focuses on individual habits, while the other changes purchasing and reuse systems. The organisers want proposals that explain who will act and how progress will be measured. Students are encouraged to discuss practical obstacles as well as expected benefits.",lq:[["What are the two approaches?",["Habits and system changes","Exams and holidays","Reading and writing"],0,"individual habits \u4E0E purchasing and reuse systems\u3002"],["What should proposals explain?",["Who acts and how progress is measured","Only a slogan","Only expected publicity"],0,"who will act and how progress will be measured\u3002"]],text:"Sustainability campaigns often ask individuals to make better choices. Such choices matter, yet their impact is shaped by systems. A reusable cup is less convenient if there is nowhere to wash it, and careful sorting achieves little if collection mixes the waste again. Effective proposals connect personal action with institutional design. They identify responsibility, resources and ways to evaluate progress. Trade-offs should be discussed openly: a measure that looks efficient on paper may transfer work to people with little time. Durable change depends on understanding these conditions rather than assuming that awareness alone will transform behaviour.",rq:[["Why might a reusable cup be inconvenient?",["No place to wash it","Its name is unfamiliar","Students never drink"],0,"\u539F\u6587\u4E3E\u51FA\u7F3A\u5C11\u6E05\u6D17\u5730\u70B9\u7684\u6761\u4EF6\u9650\u5236\u3002"],["What connects effective proposals?",["Personal action and institutional design","Publicity and slogans only","Awareness and blame"],0,"connect personal action with institutional design\u3002"],["What is the writer's view of awareness?",["Necessary efforts need more than awareness","Awareness guarantees change","Awareness is always useless"],0,"\u672B\u53E5\u53CD\u5BF9\u5047\u5B9A\u610F\u8BC6\u672C\u8EAB\u5C31\u80FD\u6539\u53D8\u884C\u4E3A\u3002"]],speaking:["Individual choices are shaped by the systems around them.","An effective proposal should explain how its impact will be measured."],words:[["institutional","/\u02CC\u026Anst\u026A\u02C8tu\u02D0\u0283\u0259nl/","\u673A\u6784\u7684\uFF1B\u5236\u5EA6\u7684"],["evaluate","/\u026A\u02C8v\xE6ljue\u026At/","\u8BC4\u4F30"]],prompt:"\u7528\u82F1\u6587\u63D0\u51FA\u4E00\u4E2A\u6821\u56ED\u51CF\u5E9F\u65B9\u6848\uFF0C\u89E3\u91CA\u884C\u52A8\u3001\u6267\u884C\u6761\u4EF6\u3001\u53EF\u80FD\u56F0\u96BE\u4E0E\u8861\u91CF\u65B9\u6CD5\u3002",requirements:["\u5177\u4F53\u884C\u52A8","\u6761\u4EF6\u6216\u6743\u8861","\u6548\u679C\u8BC4\u4F30\u65B9\u6CD5"]},{route:"cet6",title:"\u628A\u7ECF\u5386\u8BB2\u6210\u80FD\u529B",tag:"Your next chapter",scene:"\u9762\u8BD5\u4E0E\u804C\u4E1A\u8868\u8FBE",script:"In a careers workshop, students practised describing a challenge without exaggerating their role. The adviser suggested explaining the situation, the action taken and the result. A useful example may come from a class project rather than a prestigious internship. Specific details help an interviewer understand a candidate's contribution and what they learned.",lq:[["How should an example be organised?",["Situation, action and result","Only a job title","A list of adjectives"],0,"situation, action taken and result\u3002"],["Where can a useful example come from?",["A class project","Only a famous company","Only paid work"],0,"may come from a class project\u3002"]],text:"When students describe their experience, they may underestimate ordinary responsibilities and overuse impressive labels. Yet a title tells an interviewer little about how someone works. A concrete account of resolving a disagreement or organising shared information can demonstrate useful abilities. The strongest examples acknowledge other people's contributions and explain what changed because of a particular action. Reflection matters too: a setback can reveal learning if the speaker shows how they would respond differently. Credibility comes from precise, proportionate claims rather than a story in which one person appears to have solved everything alone.",rq:[["What reveals working ability?",["A concrete account of actions","An impressive label alone","An exaggerated role"],0,"\u5177\u4F53\u8BB2\u8FF0\u89E3\u51B3\u5206\u6B67\u6216\u7EC4\u7EC7\u4FE1\u606F\u80FD\u4F53\u73B0\u80FD\u529B\u3002"],["What should strong examples acknowledge?",["Other people's contributions","Only personal success","No changes"],0,"acknowledge other people's contributions\u3002"],["What builds credibility?",["Precise, proportionate claims","Solving everything alone","Avoiding all setbacks"],0,"\u6700\u540E\u4E00\u53E5\u5F3A\u8C03\u51C6\u786E\u3001\u4E0E\u5B9E\u9645\u76F8\u79F0\u7684\u63CF\u8FF0\u3002"]],speaking:["My main contribution was to organise the information for the team.","The experience taught me to communicate expectations more clearly."],words:[["contribution","/\u02CCk\u0251\u02D0ntr\u026A\u02C8bju\u02D0\u0283n/","\u8D21\u732E"],["credibility","/\u02CCkred\u0259\u02C8b\u026Al\u0259ti/","\u53EF\u4FE1\u5EA6"]],prompt:"\u7528\u82F1\u6587\u63CF\u8FF0\u4F60\u5728\u56E2\u961F\u4E2
